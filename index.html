<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELJO-RADIO</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #0b1020;
    color: #eee;
    font-family: Arial, sans-serif;
}

.container {
    max-width: 750px;
    margin: auto;
}

h1 {
    text-align: center;
    color: #e94560;
    font-size: 38px;
    margin: 10px 0 5px;
}

.subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 20px;
}

.nav {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.nav a {
    flex: 1;
    padding: 14px;
    text-align: center;
    text-decoration: none;
    color: white;
    background: #163d6b;
    border-radius: 8px;
    font-weight: bold;
}

.nav a.active {
    background: #e94560;
}

.player-box {
    background: #16213e;
    padding: 20px;
    border-radius: 15px;
}

.now {
    text-align: center;
    color: #e94560;
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 15px;
}

audio {
    width: 100%;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

button {
    flex: 1;
    padding: 14px;
    border: 0;
    border-radius: 8px;
    background: #e94560;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #ff5570;
}

.playlist-title {
    margin-top: 25px;
    color: #e94560;
    font-size: 20px;
    font-weight: bold;
}

ul {
    list-style: none;
    padding: 0;
}

li {
    background: #16213e;
    margin: 8px 0;
    padding: 14px;
    border-radius: 8px;
    cursor: pointer;
}

li:hover {
    background: #0f3460;
}

li.active {
    background: #0f3460;
    border-left: 5px solid #e94560;
}

.status {
    text-align: center;
    color: #888;
    margin-top: 20px;
}

.error {
    color: #ff4d6d;
    font-weight: bold;
}

@media (max-width: 600px) {
    .nav,
    .buttons {
        flex-direction: column;
    }

    h1 {
        font-size: 29px;
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🎵 VELJO-RADIO</h1>

<div class="subtitle">
    My Media Center — MP3
</div>

<div class="nav">

<a
href="https://velimir62.github.io/moja-muzika/"
class="active">
🎵 VELJO-RADIO
</a>

<a
href="https://velimir62.github.io/veljo-video-muzika/">
🎬 VELJO-VIDEO
</a>

</div>

<div class="player-box">

<div id="now" class="now">
🎵 Učitavanje muzike...
</div>

<audio id="player" controls></audio>

<div class="buttons">

<button id="play">
▶ Pokreni
</button>

<button id="prev">
⏮ Prethodna
</button>

<button id="next">
Sljedeća ⏭
</button>

</div>

</div>

<div class="playlist-title">
🎵 Playlist
</div>

<ul id="playlist"></ul>

<div id="status" class="status">
Učitavanje...
</div>

</div>

<script>

const API =
"https://api.github.com/repos/velimir62/moja-muzika/contents/";

const playlist =
document.getElementById("playlist");

const player =
document.getElementById("player");

const now =
document.getElementById("now");

const status =
document.getElementById("status");

let songs = [];
let current = -1;


/* UČITAJ MP3 FAJLOVE IZ ROOTA */

async function loadSongs() {

    const response =
    await fetch(API, {
        cache: "no-store"
    });

    if (!response.ok) {
        throw new Error(
            "GitHub API nije dostupan."
        );
    }

    const files =
    await response.json();

    songs = files
    .filter(file =>
        file.type === "file" &&
        file.name
        .toLowerCase()
        .endsWith(".mp3")
    )
    .map(file => ({
        title: file.name
        .replace(/\.mp3$/i, ""),

        url: file.download_url
    }));

    songs.sort((a, b) =>
        a.title.localeCompare(
            b.title,
            undefined,
            {
                numeric: true,
                sensitivity: "base"
            }
        )
    );
}


/* PRIKAŽI PLAYLISTU */

function showPlaylist() {

    playlist.innerHTML = "";

    songs.forEach((song, index) => {

        const li =
        document.createElement("li");

        li.textContent =
        "🎵 " + song.title;

        li.onclick = function() {
            playSong(index);
        };

        playlist.appendChild(li);
    });

    status.textContent =
    songs.length +
    " MP3 fajlova pronađeno";
}


/* PUSTI PJESMU */

function playSong(index) {

    if (
        index < 0 ||
        index >= songs.length
    ) {
        return;
    }

    current = index;

    player.src =
    songs[index].url;

    now.textContent =
    "🎵 " +
    songs[index].title +
    " (" +
    (index + 1) +
    " / " +
    songs.length +
    ")";

    document.title =
    songs[index].title +
    " - VELJO-RADIO";

    Array.from(
        playlist.children
    ).forEach(li =>
        li.classList.remove("active")
    );

    if (playlist.children[index]) {

        playlist.children[index]
        .classList.add("active");
    }
}


/* POKRENI */

document.getElementById("play").onclick =
function() {

    if (songs.length === 0) {
        return;
    }

    if (current === -1) {
        playSong(0);
    }

    player.play().catch(() => {});
};


/* PRETHODNA */

document.getElementById("prev").onclick =
function() {

    if (current > 0) {

        playSong(current - 1);

        player.play().catch(() => {});
    }
};


/* SLJEDEĆA */

document.getElementById("next").onclick =
function() {

    if (
        current < songs.length - 1
    ) {

        playSong(current + 1);

        player.play().catch(() => {});
    }
};


/* AUTOMATSKA SLJEDEĆA */

player.onended = function() {

    if (
        current < songs.length - 1
    ) {

        playSong(current + 1);

        player.play().catch(() => {});
    }
};


/* TIPKE */

document.onkeydown = function(e) {

    if (
        e.key === "ArrowRight" &&
        current < songs.length - 1
    ) {
        playSong(current + 1);
    }

    if (
        e.key === "ArrowLeft" &&
        current > 0
    ) {
        playSong(current - 1);
    }
};


/* START */

async function start() {

    try {

        await loadSongs();

        if (songs.length === 0) {

            now.textContent =
            "🎵 Nema MP3 fajlova";

            status.textContent =
            "Nisu pronađeni MP3 fajlovi.";

            return;
        }

        showPlaylist();

        now.textContent =
        "🎵 " +
        songs.length +
        " MP3 fajlova spremno";

    } catch (error) {

        console.error(error);

        now.innerHTML =
        '<span class="error">' +
        "❌ Greška pri učitavanju muzike" +
        "</span>";

        status.textContent =
        error.message;
    }
}

start();

</script>

</body>
</html>
