
<script>
const OWNER = "velimir62";
const REPO = "moja-muzika";
const BRANCH = "master";

const audio = document.getElementById("audio");
const status = document.getElementById("status");
const nowPlaying = document.getElementById("nowPlaying");
const trackList = document.getElementById("trackList");
const search = document.getElementById("search");
const playPauseButton = document.getElementById("playPause");
const shuffleButton = document.getElementById("shuffle");

let tracks = [];
let currentIndex = -1;
let shuffleOn = false;

function sortNumerically(a, b) {
  const na = parseInt(a.match(/^\s*(\d+)/)?.[1] || "0", 10);
  const nb = parseInt(b.match(/^\s*(\d+)/)?.[1] || "0", 10);
  return na - nb || a.localeCompare(b, "sr");
}

function renderTracks() {
  const query = search.value.trim().toLocaleLowerCase();
  trackList.replaceChildren();

  tracks.forEach((track, index) => {
    if (!track.name.toLocaleLowerCase().includes(query)) return;

    const item = document.createElement("li");
    item.textContent = track.name;

    if (index === currentIndex) item.classList.add("active");

    item.addEventListener("click", () => playTrack(index));
    trackList.appendChild(item);
  });
}

async function playTrack(index) {
  if (!tracks.length) return;

  currentIndex = (index + tracks.length) % tracks.length;
  const track = tracks[currentIndex];

  audio.src = track.url;
  audio.load();
  nowPlaying.textContent = "Pesma: " + track.name;
  status.textContent = "";
  renderTracks();

  try {
    await audio.play();
  } catch (error) {
    status.textContent =
      "Pritisni dugme Pusti za pokretanje pesme.";
    console.error(error);
  }
}

function playNext() {
  if (!tracks.length) return;

  let nextIndex = currentIndex + 1;

  if (shuffleOn && tracks.length > 1) {
    do {
      nextIndex = Math.floor(Math.random() * tracks.length);
    } while (nextIndex === currentIndex);
  }

  playTrack(nextIndex);
}

async function loadTracks() {
  status.textContent = "Učitavam pesme...";

  const apiUrl =
    `https://api.github.com/repos/${OWNER}/${REPO}/contents/?ref=${BRANCH}`;

  try {
    const response = await fetch(apiUrl);

    if (!response.ok) {
      throw new Error("GitHub odgovor: " + response.status);
    }

    const files = await response.json();

    tracks = files
      .filter(file =>
        file.type === "file" &&
        /\.mp3$/i.test(file.name) &&
        file.download_url
      )
      .map(file => ({
        name: file.name,
        url: file.download_url
      }))
      .sort((a, b) => sortNumerically(a.name, b.name));

    if (!tracks.length) {
      status.textContent =
        "Nema MP3 pesama u glavnom folderu repozitorijuma.";
      return;
    }

    currentIndex = 0;
    audio.src = tracks[0].url;
    nowPlaying.textContent = "Izabrana pesma: " + tracks[0].name;
    status.textContent = "Učitano pesama: " + tracks.length;
    renderTracks();

  } catch (error) {
    status.textContent =
      "Greška pri učitavanju. Proveri javnost repozitorijuma i nazive fajlova.";
    console.error(error);
  }
}

document.getElementById("previous").addEventListener("click", () => {
  if (tracks.length) {
    playTrack(currentIndex <= 0 ? tracks.length - 1 : currentIndex - 1);
  }
});

document.getElementById("next").addEventListener("click", playNext);

playPauseButton.addEventListener("click", async () => {
  if (!tracks.length) return;

  try {
    if (audio.paused) {
      await audio.play();
    } else {
      audio.pause();
    }
  } catch (error) {
    status.textContent = "Pesma nije mogla da se pokrene.";
    console.error(error);
  }
});

shuffleButton.addEventListener("click", () => {
  shuffleOn = !shuffleOn;
  shuffleButton.textContent = shuffleOn
    ? "🔀 Nasumično: uključeno"
    : "🔀 Nasumično: isključeno";
});

search.addEventListener("input", renderTracks);
audio.addEventListener("ended", playNext);

audio.addEventListener("play", () => {
  playPauseButton.textContent = "⏸ Pauza";
});

audio.addEventListener("pause", () => {
  playPauseButton.textContent = "▶ Pusti";
});

audio.addEventListener("error", () => {
  if (currentIndex >= 0 && tracks[currentIndex]) {
    status.textContent =
      "Greška pri reprodukciji: " + tracks[currentIndex].name;
  }
});

loadTracks();
</script>
