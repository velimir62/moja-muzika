<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moja muzika</title>

  <style>
    body {
      max-width: 760px;
      margin: 30px auto;
      padding: 0 16px;
      font: 16px/1.5 system-ui, sans-serif;
      color: #222;
      background: #f7f7f7;
    }

    audio {
      display: block;
      width: 100%;
      margin: 12px 0;
    }

    #search {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      font: inherit;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }

    #status {
      color: #555;
      overflow-wrap: anywhere;
    }

    ol {
      padding-left: 34px;
    }

    .track {
      border: 0;
      padding: 5px 8px;
      font: inherit;
      text-align: left;
      color: #174ea6;
      background: transparent;
      cursor: pointer;
    }

    .track:hover,
    .track.active {
      color: #b00020;
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <h1>Moja muzika</h1>

  <div id="status">Učitavam pjesme…</div>

  <audio id="player" controls preload="none"></audio>

  <div class="controls">
    <button id="start" type="button">▶ Pusti muziku</button>
    <button id="previous" type="button">⏮ Prethodna</button>
    <button id="next" type="button">Sljedeća ⏭</button>
    <button id="shuffle" type="button">🔀 Nasumično: isključeno</button>
  </div>

  <input id="search" type="search" placeholder="Pretraži pjesme…">
  <ol id="playlist"></ol>

  <script>
    const owner = "velimir62";
    const repository = "moja-muzika";
    const branch = "master";

    const player = document.getElementById("player");
    const playlist = document.getElementById("playlist");
    const status = document.getElementById("status");
    const search = document.getElementById("search");
    const shuffleButton = document.getElementById("shuffle");

    let tracks = [];
    let currentIndex = -1;
    let shuffle = false;

    function makeRawUrl(path) {
      const encodedPath = path
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");

      return `https://raw.githubusercontent.com/${owner}/${repository}/${branch}/${encodedPath}`;
    }

    async function loadTracks() {
      try {
        const apiUrl =
          `https://api.github.com/repos/${owner}/${repository}` +
          `/git/trees/${branch}?recursive=1`;

        const response = await fetch(apiUrl);

        if (!response.ok) {
          throw new Error(
            `GitHub ne može učitati listu fajlova (HTTP ${response.status}).`
          );
        }

        const data = await response.json();

        tracks = (data.tree || [])
          .filter(file =>
            file.type === "blob" &&
            /\.mp3$/i.test(file.path)
          )
          .sort((a, b) =>
            a.path.localeCompare(b.path, undefined, {
              numeric: true,
              sensitivity: "base"
            })
          );

        if (data.truncated) {
          throw new Error("GitHub nije vratio cijelu listu fajlova.");
        }

        if (tracks.length === 0) {
          status.textContent =
            "Nema pronađenih MP3 fajlova. Provjeri da su u grani master.";
          return;
        }

        renderPlaylist();
        status.textContent =
          `Pronađeno pjesama: ${tracks.length}. Izaberi pjesmu za puštanje.`;
      } catch (error) {
        status.textContent = "Greška: " + error.message;
      }
    }

    function renderPlaylist() {
      const query = search.value.trim().toLocaleLowerCase();
      playlist.replaceChildren();

      tracks.forEach((track, index) => {
        const filename = track.path.split("/").pop();

        if (!filename.toLocaleLowerCase().includes(query)) {
          return;
        }

        const item = document.createElement("li");
        const button = document.createElement("button");

        button.type = "button";
        button.className = "track";
        button.textContent = filename;

        if (index === currentIndex) {
          button.classList.add("active");
        }

        button.addEventListener("click", () => playTrack(index));

        item.appendChild(button);
        playlist.appendChild(item);
      });
    }

    async function playTrack(index) {
      if (index < 0 || index >= tracks.length) {
        return;
      }

      currentIndex = index;
      const track = tracks[index];
      const filename = track.path.split("/").pop();

      player.pause();
      player.src = makeRawUrl(track.path);
      player.load();
      renderPlaylist();
      status.textContent = `Učitavam: ${filename}`;

      try {
        await player.play();
        status.textContent = `Sada svira: ${filename}`;
      } catch (error) {
        status.textContent =
          `Nije pokrenuta: ${filename}. Pritisni ▶ na audio playeru.`;
      }
    }

    function playNext() {
      if (tracks.length === 0) return;

      if (shuffle && tracks.length > 1) {
        let nextIndex;

        do {
          nextIndex = Math.floor(Math.random() * tracks.length);
        } while (nextIndex === currentIndex);

        playTrack(nextIndex);
      } else {
        playTrack((currentIndex + 1) % tracks.length);
      }
    }

    document.getElementById("start").addEventListener("click", () => {
      if (currentIndex === -1) {
        playTrack(0);
      } else {
        player.play().catch(() => {
          status.textContent =
            "Pritisni ▶ na samom audio playeru da pokreneš pjesmu.";
        });
      }
    });

    document.getElementById("previous").addEventListener("click", () => {
      if (tracks.length === 0) return;

      const previousIndex =
        (currentIndex - 1 + tracks.length) % tracks.length;

      playTrack(previousIndex);
    });

    document.getElementById("next").addEventListener("click", playNext);

    document.getElementById("shuffle").addEventListener("click", () => {
      shuffle = !shuffle;
      shuffleButton.textContent =
        `🔀 Nasumično: ${shuffle ? "uključeno" : "isključeno"}`;
    });

    search.addEventListener("input", renderPlaylist);
    player.addEventListener("ended", playNext);

    player.addEventListener("error", () => {
      const code = player.error ? player.error.code : 0;
      const messages = {
        1: "Učitavanje pjesme je prekinuto.",
        2: "Greška pri preuzimanju pjesme.",
        3: "Pregledač ne može pročitati ovaj MP3 fajl.",
        4: "MP3 fajl nije pronađen na toj putanji."
      };

      status.textContent =
        messages[code] || `Greška pri učitavanju pjesme (kod ${code}).`;
    });

    loadTracks();
  </script>
</body>
</html>
