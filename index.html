<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moja muzika</title>
  <style>
    body {
      max-width: 760px;
      margin: 30px auto;
      padding: 0 16px;
      font: 16px/1.5 system-ui, sans-serif;
      color: #222;
      background: #f7f7f7;
    }

    audio {
      width: 100%;
      margin: 12px 0;
    }

    #search {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      font: inherit;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }

    #status { color: #555; }

    ol { padding-left: 34px; }

    button.track {
      border: 0;
      padding: 5px 8px;
      font: inherit;
      text-align: left;
      color: #174ea6;
      background: transparent;
      cursor: pointer;
    }

    button.track:hover,
    button.track.active {
      color: #b00020;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Moja muzika</h1>
  <div id="status">Učitavam pjesme…</div>

  <audio id="player" controls preload="metadata"></audio>

  <div class="controls">
    <button id="start" type="button">▶ Pusti muziku</button>
    <button id="previous" type="button">⏮ Prethodna</button>
    <button id="next" type="button">Sljedeća ⏭</button>
    <button id="shuffle" type="button">🔀 Nasumično: isključeno</button>
  </div>

  <input id="search" type="search" placeholder="Pretraži pjesme…">
  <ol id="playlist"></ol>

  <script>
    const owner = "velimir62";
    const repository = "moja-muzika";
    const branch = "master";

    const player = document.getElementById("player");
    const playlist = document.getElementById("playlist");
    const status = document.getElementById("status");
    const search = document.getElementById("search");
    const shuffleButton = document.getElementById("shuffle");

    let tracks = [];
    let currentIndex = -1;
    let shuffle = false;

    function rawUrl(path) {
      const encodedPath = path
        .split("/")
        .map(encodeURIComponent)
        .join("/");

      return `https://raw.githubusercontent.com/${owner}/${repository}/${branch}/${encodedPath}`;
    }

    async function loadTracks() {
      try {
        const response = await fetch(
          `https://api.github.com/repos/${owner}/${repository}/git/trees/${branch}?recursive=1`
        );

        if (!response.ok) {
          throw new Error(`GitHub API greška (${response.status})`);
        }

        const data = await response.json();

        tracks = (data.tree || [])
          .filter(file =>
            file.type === "blob" &&
            /\.(mp3|mp4)$/i.test(file.path)
          )
          .sort((a, b) =>
            a.path.localeCompare(b.path, undefined, {
              numeric: true,
              sensitivity: "base"
            })
          );

        if (!tracks.length) {
          status.textContent = "Nisam pronašao MP3 ili MP4 fajlove.";
          return;
        }

        showTracks();
        status.textContent = `Učitano pjesama: ${tracks.length}`;

        // Pokušaj pokretanja prve pjesme. Pregledač može tražiti klik korisnika.
        playTrack(0, true);
      } catch (error) {
        status.textContent = "Greška pri učitavanju: " + error.message;
      }
    }

    function showTracks() {
      const query = search.value.trim().toLocaleLowerCase();
      playlist.replaceChildren();

      tracks.forEach((track, index) => {
        const name = track.path.split("/").pop();

        if (!name.toLocaleLowerCase().includes(query)) return;

        const item = document.createElement("li");
        const button = document.createElement("button");

        button.type = "button";
        button.className = "track";
        button.textContent = name;
        button.classList.toggle("active", index === currentIndex);
        button.addEventListener("click", () => playTrack(index));

        item.appendChild(button);
        playlist.appendChild(item);
      });
    }

    function playTrack(index, automaticAttempt = false) {
      if (index < 0 || index >= tracks.length) return;

      currentIndex = index;
      player.src = rawUrl(tracks[index].path);
      showTracks();

      player.play()
        .then(() => {
          status.textContent =
            "Sada svira: " + tracks[index].path.split("/").pop();
        })
        .catch(() => {
          status.textContent = automaticAttempt
            ? "Pregledač je blokirao automatsko puštanje. Klikni „Pusti muziku“."
            : "Klikni Play na audio playeru da pokreneš pjesmu.";
        });
    }

    function nextTrack() {
      if (!tracks.length) return;

      if (shuffle && tracks.length > 1) {
        let nextIndex;
        do {
          nextIndex = Math.floor(Math.random() * tracks.length);
        } while (nextIndex === currentIndex);

        playTrack(nextIndex);
      } else {
        playTrack((currentIndex + 1) % tracks.length);
      }
    }

    document.getElementById("start").addEventListener("click", () => {
      if (currentIndex === -1 && tracks.length) {
        playTrack(0);
      } else {
        player.play().catch(() => {
          status.textContent = "Pritisni Play na audio playeru.";
        });
      }
    });

    document.getElementById("previous").addEventListener("click", () => {
      if (tracks.length) {
        playTrack((currentIndex - 1 + tracks.length) % tracks.length);
      }
    });

    document.getElementById("next").addEventListener("click", nextTrack);

    shuffleButton.addEventListener("click", () => {
      shuffle = !shuffle;
      shuffleButton.textContent =
        `🔀 Nasumično: ${shuffle ? "uključeno" : "isključeno"}`;
    });

    search.addEventListener("input", showTracks);

    player.addEventListener("ended", nextTrack);

    player.addEventListener("error", () => {
      status.textContent =
        "Greška pri učitavanju pjesme. Provjeri da li se fajl nalazi u repozitorijumu.";
    });

    loadTracks();
  </script>
</body>
</html>
