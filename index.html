<!DOCTYPE html>

<body>

<div class="container">

    <h1>🎵 VELJO-RADIO</h1>

    <div class="subtitle">
        My Media Center
    </div>

    <div class="nav">

        <a href="https://velimir62.github.io/moja-muzika/"
           class="active">
            🎵 VELJO-RADIO
        </a>

        <a href="https://velimir62.github.io/veljo-video-muzika/">
            🎬 VELJO-VIDEO
        </a>

    </div>

    <div class="player-box">

        <div id="nowPlaying" class="now-playing">
            🎵 Učitavanje muzike...
        </div>

        <audio id="player"
               controls
               preload="metadata">
        </audio>

        <div class="buttons">

            <button id="play">
                ▶ Pokreni
            </button>

            <button id="prev">
                ⏮ Prethodna
            </button>

            <button id="next">
                Sljedeća ⏭
            </button>

        </div>

    </div>

    <div class="playlist-title">
        🎵 Muzička lista
    </div>

    <ul id="playlist"></ul>

    <div id="status" class="status">
        Učitavanje...
    </div>

</div>

<script>

/* =========================================================
   GITHUB PODEŠAVANJA
   ========================================================= */

const GITHUB_USER = "velimir62";
const GITHUB_REPO = "moja-muzika";

/*
   VAŽNO:
   GitHub repozitorijum koristi "master" granu.
*/
const GITHUB_BRANCH = "master";

const API_URL =
    `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/git/trees/${GITHUB_BRANCH}?recursive=1`;

const RAW_BASE =
    `https://raw.githubusercontent.com/${GITHUB_USER}/${GITHUB_REPO}/${GITHUB_BRANCH}/`;


/* =========================================================
   ELEMENTI
   ========================================================= */

const player =
    document.getElementById("player");

const playlist =
    document.getElementById("playlist");

const nowPlaying =
    document.getElementById("nowPlaying");

const status =
    document.getElementById("status");

const playButton =
    document.getElementById("play");

const prevButton =
    document.getElementById("prev");

const nextButton =
    document.getElementById("next");


let songs = [];
let current = -1;


/* =========================================================
   NAPRAVI RAW GITHUB URL
   ========================================================= */

function makeRawUrl(path) {

    return RAW_BASE +
        path
            .split("/")
            .map(part => encodeURIComponent(part))
            .join("/");
}


/* =========================================================
   UČITAJ MP3 FAJLOVE
   ========================================================= */

async function loadSongs() {

    status.textContent =
        "Učitavanje MP3 fajlova...";

    const response =
        await fetch(API_URL, {
            cache: "no-store",
            headers: {
                "Accept":
                    "application/vnd.github+json"
            }
        });

    if (!response.ok) {

        if (response.status === 404) {
            throw new Error(
                "GitHub nije pronašao repozitorijum ili master granu."
            );
        }

        if (response.status === 403) {
            throw new Error(
                "GitHub je privremeno ograničio API pristup. Pokušaj ponovo."
            );
        }

        throw new Error(
            "GitHub greška: " +
            response.status
        );
    }

    const data =
        await response.json();

    if (!data.tree) {
        throw new Error(
            "GitHub nije vratio listu fajlova."
        );
    }


    /*
       Pronađi sve MP3 fajlove.
       Radi i za podfoldere.
    */

    songs = data.tree
        .filter(file =>
            file.type === "blob" &&
            /\.mp3$/i.test(file.path)
        )
        .map(file => {

            const parts =
                file.path.split("/");

            const filename =
                parts[parts.length - 1];

            return {

                name: filename,

                path: file.path,

                title:
                    filename.replace(
                        /\.mp3$/i,
                        ""
                    ),

                url:
                    makeRawUrl(file.path)
            };
        });


    /*
       Sortiranje po nazivu.
    */

    songs.sort((a, b) =>
        a.title.localeCompare(
            b.title,
            undefined,
            {
                numeric: true,
                sensitivity: "base"
            }
        )
    );
}


/* =========================================================
   PRIKAŽI PLAYLISTU
   ========================================================= */

function showPlaylist() {

    playlist.innerHTML = "";

    songs.forEach((song, index) => {

        const li =
            document.createElement("li");

        li.textContent =
            "🎵 " + song.title;

        li.title =
            song.path;

        li.addEventListener(
            "click",
            function () {

                playSong(index);

                player.play()
                    .catch(function () {});
            }
        );

        playlist.appendChild(li);
    });

    status.innerHTML =
        '<span class="success">' +
        "✓ " +
        songs.length +
        " MP3 fajlova pronađeno" +
        "</span>";
}


/* =========================================================
   POKRENI PJESMU
   ========================================================= */

function playSong(index) {

    if (
        index < 0 ||
        index >= songs.length
    ) {
        return;
    }

    current = index;

    player.src =
        songs[current].url;

    player.load();

    nowPlaying.textContent =
        "🎵 " +
        songs[current].title +
        " (" +
        (current + 1) +
        " / " +
        songs.length +
        ")";

    document.title =
        songs[current].title +
        " - VELJO-RADIO";


    /*
       Ukloni aktivnu oznaku
       sa svih pjesama.
    */

    Array.from(
        playlist.children
    ).forEach(function (li) {

        li.classList.remove(
            "active"
        );
    });


    /*
       Označi trenutnu pjesmu.
    */

    const active =
        playlist.children[current];

    if (active) {

        active.classList.add(
            "active"
        );

        active.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });
    }
}


/* =========================================================
   AUDIO GREŠKA
   ========================================================= */

player.addEventListener(
    "error",
    function () {

        if (
            current >= 0 &&
            songs[current]
        ) {

            nowPlaying.innerHTML =
                '<span class="error">' +
                "❌ Greška pri učitavanju: " +
                songs[current].title +
                "</span>";

            status.textContent =
                "MP3 fajl nije moguće učitati. Provjeri da li postoji na GitHubu.";
        }
    }
);


/* =========================================================
   POKRENI
   ========================================================= */

playButton.addEventListener(
    "click",
    function () {

        if (songs.length === 0) {
            return;
        }

        if (current === -1) {
            playSong(0);
        }

        player.play()
            .catch(function () {});
    }
);


/* =========================================================
   PRETHODNA
   ========================================================= */

prevButton.addEventListener(
    "click",
    function () {

        if (current > 0) {

            playSong(current - 1);

            player.play()
                .catch(function () {});
        }
    }
);


/* =========================================================
   SLJEDEĆA
   ========================================================= */

nextButton.addEventListener(
    "click",
    function () {

        if (
            current < songs.length - 1
        ) {

            playSong(current + 1);

            player.play()
                .catch(function () {});
        }
    }
);


/* =========================================================
   KADA PJESMA ZAVRŠI
   ========================================================= */

player.addEventListener(
    "ended",
    function () {

        if (
            current < songs.length - 1
        ) {

            playSong(current + 1);

            player.play()
                .catch(function () {});
        }
    }
);


/* =========================================================
   TIPKE LIJEVO / DESNO
   ========================================================= */

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "ArrowRight" &&
            current < songs.length - 1
        ) {

            playSong(current + 1);
        }

        if (
            event.key === "ArrowLeft" &&
            current > 0
        ) {

            playSong(current - 1);
        }
    }
);


/* =========================================================
   START
   ========================================================= */

async function start() {

    try {

        await loadSongs();


        if (songs.length === 0) {

            nowPlaying.textContent =
                "🎵 Nema MP3 fajlova";

            status.textContent =
                "Nijedan MP3 nije pronađen u repozitorijumu.";

            return;
        }


        showPlaylist();


        nowPlaying.textContent =
            "🎵 " +
            songs.length +
            " MP3 fajlova spremno";


    } catch (error) {

        console.error(
            "VELJO-RADIO:",
            error
        );

        nowPlaying.innerHTML =
            '<span class="error">' +
            "❌ Greška pri učitavanju muzike" +
            "</span>";

        status.textContent =
            error.message;
    }
}


/* =========================================================
   POKRENI APLIKACIJU
   ========================================================= */

start();

</script>

</body>
</html>
