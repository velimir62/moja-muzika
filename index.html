<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moja muzika</title>
  <style>
    body {
      max-width: 760px;
      margin: 30px auto;
      padding: 0 16px;
      font: 16px/1.5 system-ui, sans-serif;
      color: #222;
      background: #f7f7f7;
    }

    h1 { margin-bottom: 8px; }

    audio {
      position: sticky;
      top: 0;
      width: 100%;
      margin: 12px 0;
      background: #f7f7f7;
    }

    #status { color: #555; }

    ol {
      padding-left: 34px;
    }

    li { padding: 3px 0; }

    button.track {
      border: 0;
      padding: 5px 8px;
      font: inherit;
      text-align: left;
      color: #174ea6;
      background: transparent;
      cursor: pointer;
    }

    button.track:hover,
    button.track.active {
      color: #b00020;
      text-decoration: underline;
    }

    .controls {
      display: flex;
      gap: 8px;
      margin: 8px 0;
    }

    .controls button {
      padding: 8px 14px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Moja muzika</h1>
  <div id="status">Učitavam pjesme…</div>

  <audio id="player" controls preload="metadata"></audio>

  <div class="controls">
    <button id="previous" type="button">⏮ Prethodna</button>
    <button id="next" type="button">Sljedeća ⏭</button>
  </div>

  <ol id="playlist"></ol>

  <script>
    const owner = "velimir62";
    const repository = "moja-muzika";
    const branch = "master";

    const player = document.getElementById("player");
    const playlist = document.getElementById("playlist");
    const status = document.getElementById("status");

    let tracks = [];
    let currentIndex = -1;

    function rawUrl(path) {
      return "https://raw.githubusercontent.com/" +
        owner + "/" + repository + "/" + branch + "/" +
        path.split("/").map(encodeURIComponent).join("/");
    }

    async function loadTracks() {
      try {
        const response = await fetch(
          `https://api.github.com/repos/${owner}/${repository}/git/trees/${branch}?recursive=1`
        );

        if (!response.ok) {
          throw new Error(`GitHub API greška (${response.status})`);
        }

        const data = await response.json();

        tracks = (data.tree || [])
          .filter(item =>
            item.type === "blob" &&
            /\.(mp3|mp4)$/i.test(item.path)
          )
          .sort((a, b) =>
            a.path.localeCompare(b.path, undefined, {
              numeric: true,
              sensitivity: "base"
            })
          );

        if (!tracks.length) {
          status.textContent = "Nisam pronašao nijedan MP3 ili MP4 fajl.";
          return;
        }

        playlist.replaceChildren();

        tracks.forEach((track, index) => {
          const item = document.createElement("li");
          const button = document.createElement("button");

          button.type = "button";
          button.className = "track";
          button.textContent = track.path.split("/").pop();
          button.addEventListener("click", () => playTrack(index));

          item.appendChild(button);
          playlist.appendChild(item);
        });

        status.textContent = `Učitano pjesama: ${tracks.length}`;
      } catch (error) {
        status.textContent =
          "Greška pri učitavanju liste: " + error.message;
      }
    }

    function playTrack(index) {
      if (index < 0 || index >= tracks.length) return;

      currentIndex = index;
      player.src = rawUrl(tracks[index].path);
      player.play().catch(() => {
        status.textContent =
          "Pjesma nije mogla automatski da se pokrene. Pritisni Play.";
      });

      document.querySelectorAll(".track").forEach((button, i) => {
        button.classList.toggle("active", i === index);
      });

      status.textContent = "Sada svira: " + tracks[index].path.split("/").pop();
    }

    document.getElementById("previous").addEventListener("click", () => {
      if (tracks.length) {
        playTrack((currentIndex - 1 + tracks.length) % tracks.length);
      }
    });

    document.getElementById("next").addEventListener("click", () => {
      if (tracks.length) {
        playTrack((currentIndex + 1) % tracks.length);
      }
    });

    player.addEventListener("ended", () => {
      if (tracks.length) {
        playTrack((currentIndex + 1) % tracks.length);
      }
    });

    loadTracks();
  </script>
</body>
</html>
