<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veljo Radio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #eee;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(0,0,0,0.4);
            border-radius: 32px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }
        h1 { text-align: center; margin-bottom: 20px; font-weight: 600; }
        .radio-btn {
            display: block;
            width: 100%;
            background: #1db954;
            border: none;
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 14px;
            border-radius: 50px;
            cursor: pointer;
            text-align: center;
            margin-bottom: 15px;
            transition: 0.2s;
        }
        .radio-btn:hover { background: #1ed760; transform: scale(1.02); }
        .status {
            text-align: center;
            font-size: 14px;
            color: #ccc;
            margin-bottom: 20px;
        }
        .playlist {
            max-height: 500px;
            overflow-y: auto;
            border-top: 1px solid #333;
            margin-top: 10px;
        }
        .song-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: #2a2a4a;
            border: none;
            color: #eee;
            padding: 10px 15px;
            margin: 6px 0;
            border-radius: 40px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.1s;
        }
        .song-btn:hover { background: #e94560; transform: translateX(5px); }
        audio { width: 100%; margin-top: 15px; display: none; }
        footer { text-align: center; margin-top: 20px; font-size: 12px; opacity: 0.7; }
    </style>
</head>

        { display: "шкорпија", file: "шкорпија.mp3" }

        ];

    const fullSongs = songsList.map(song => ({ display: song.display, url: song.file }));
    const radioBtn = document.getElementById('radioBtn');
    const radioStatus = document.getElementById('radioStatus');
    const container = document.getElementById('songListContainer');
    const player = document.getElementById('globalPlayer');
    let radioActive = false;
    let currentIndex = 0;

    function renderButtons() {
        container.innerHTML = '';
        fullSongs.forEach((song, idx) => {
            const btn = document.createElement('button');
            btn.textContent = `🎵 ${song.display}`;
            btn.className = 'song-btn';
            btn.onclick = () => {
                if (radioActive) stopRadio();
                player.src = song.url;
                player.play();
                radioStatus.innerHTML = `🎵 Svira: ${song.display}`;
            };
            container.appendChild(btn);
        });
        radioStatus.innerHTML = `✅ Učitano ${fullSongs.length} pjesama. Pritisni dugme za radio.`;
    }

    function stopRadio() {
        radioActive = false;
        radioBtn.innerHTML = '▶️ POKRENI LIVE RADIO';
        radioStatus.innerHTML = '⏸️ Radio pauziran.';
        player.pause();
    }

    function playNext() {
        if (!radioActive) return;
        currentIndex++;
        if (currentIndex >= fullSongs.length) {
            radioActive = false;
            radioBtn.innerHTML = '▶️ POKRENI LIVE RADIO';
            radioStatus.innerHTML = '🏁 Kraj plejliste. Pritisni dugme za ponovni početak.';
            player.pause();
            return;
        }
        const next = fullSongs[currentIndex];
        player.src = next.url;
        player.play();
        radioStatus.innerHTML = `🎙️ Radio svira: ${next.display}`;
    }

    function startRadio() {
        if (fullSongs.length === 0) return;
        if (currentIndex >= fullSongs.length) currentIndex = 0;
        const song = fullSongs[currentIndex];
        player.src = song.url;
        player.play();
        radioActive = true;
        radioBtn.innerHTML = '⏸️ ZAUSTAVI RADIO';
        radioStatus.innerHTML = `🎙️ Radio svira: ${song.display}`;
    }

    player.addEventListener('ended', playNext);
    radioBtn.addEventListener('click', () => {
        if (radioActive) stopRadio();
        else startRadio();
    });

    renderButtons();
</script>
