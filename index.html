<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moja muzika</title>
  <style>
    body {
      max-width: 700px;
      margin: 30px auto;
      padding: 0 16px;
      font: 16px Arial, sans-serif;
      color: #222;
    }

    h1 { margin-bottom: 18px; }

    input[type="search"] {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-bottom: 14px;
      font-size: 16px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0;
    }

    button {
      padding: 10px 14px;
      font-size: 16px;
      cursor: pointer;
    }

    #nowPlaying, #status {
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    audio { width: 100%; }

    #trackList {
      padding-left: 28px;
    }

    #trackList li {
      padding: 6px 4px;
      cursor: pointer;
    }

    #trackList li.active {
      font-weight: bold;
      background: #eee;
    }
  </style>
</head>
<body>
  <h1>Moja muzika</h1>

  <input id="search" type="search" placeholder="Pretraži pesme…">

  <div id="status">Učitavam pesme…</div>
  <div id="nowPlaying">Nijedna pesma nije izabrana</div>

  <audio id="audio" controls preload="metadata"></audio>

  <div class="controls">
    <button id="previous" type="button">⏮ Prethodna</button>
    <button id="playPause" type="button">▶ Pusti</button>
    <button id="next" type="button">Sledeća ⏭</button>
    <button id="shuffle" type="button" aria-pressed="false">🔀 Nasumično: isključeno</button>
  </div>

  <ol id="trackList"></ol>

  <script>
    const OWNER = "velimir62";
    const REPO = "moja-muzika";
    const BRANCH = "master";

    const audio = document.getElementById("audio");
    const status = document.getElementById("status");
    const nowPlaying = document.getElementById("nowPlaying");
    const trackList = document.getElementById("trackList");
    const search = document.getElementById("search");
    const playPauseButton = document.getElementById("playPause");
    const shuffleButton = document.getElementById("shuffle");

    let tracks = [];
    let currentIndex = -1;
    let shuffleOn = false;

    function sortNumerically(a, b) {
      const numberA = parseInt(a.match(/^\s*(\d+)/)?.[1] || "0", 10);
      const numberB = parseInt(b.match(/^\s*(\d+)/)?.[1] || "0", 10);
      return numberA - numberB || a.localeCompare(b, "sr");
    }

    function renderTracks() {
      const query = search.value.trim().toLocaleLowerCase();
      trackList.replaceChildren();

      tracks.forEach((name, index) => {
        if (!name.toLocaleLowerCase().includes(query)) return;

        const item = document.createElement("li");
        item.textContent = name;
        item.dataset.index = index;

        if (index === currentIndex) item.classList.add("active");

        item.addEventListener("click", () => playTrack(index));
        trackList.appendChild(item);
      });
    }

    function getTrackUrl(name) {
      return `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${encodeURIComponent(name)}`;
    }

    async function playTrack(index) {
      if (!tracks.length) return;

      currentIndex = (index + tracks.length) % tracks.length;
      const name = tracks[currentIndex];

      audio.src = getTrackUrl(name);
      nowPlaying.textContent = "Pesma: " + name;
      status.textContent = "";
      renderTracks();

      try {
        await audio.play();
        playPauseButton.textContent = "⏸ Pauza";
      } catch (error) {
        playPauseButton.textContent = "▶ Pusti";
        status.textContent = "Pritisni „Pusti” da pokreneš pesmu.";
      }
    }

    function playNext() {
      if (!tracks.length) return;

      let nextIndex;
      if (shuffleOn && tracks.length > 1) {
        do {
          nextIndex = Math.floor(Math.random() * tracks.length);
        } while (nextIndex === currentIndex);
      } else {
        nextIndex = currentIndex + 1;
      }

      playTrack(nextIndex);
    }

    async function loadTracks() {
      const apiUrl =
        `https://api.github.com/repos/${OWNER}/${REPO}/contents/?ref=${BRANCH}`;

      try {
        const response = await fetch(apiUrl);

        if (!response.ok) {
          throw new Error(`GitHub odgovor: ${response.status}`);
        }

        const files = await response.json();

        tracks = files
          .filter(file => file.type === "file" && /\.mp3$/i.test(file.name))
          .map(file => file.name)
          .sort(sortNumerically);

        if (!tracks.length) {
          status.textContent = "Nisam pronašao MP3 fajlove u glavnom folderu repozitorijuma.";
          return;
        }

        status.textContent = `Učitano pesama: ${tracks.length}`;
        renderTracks();

        // Učitava prvu pesmu, ali ne pokreće je automatski.
        currentIndex = 0;
        audio.src = getTrackUrl(tracks[currentIndex]);
        nowPlaying.textContent = "Izabrana pesma: " + tracks[currentIndex];
        renderTracks();
      } catch (error) {
        status.textContent =
          "Nisam uspeo da učitam listu pesama. Proveri da li su MP3 fajlovi u glavnom folderu i da li je repozitorijum javan.";
        console.error(error);
      }
    }

    document.getElementById("previous").addEventListener("click", () => {
      if (tracks.length) playTrack(currentIndex <= 0 ? tracks.length - 1 : currentIndex - 1);
    });

    document.getElementById("next").addEventListener("click", playNext);

    playPauseButton.addEventListener("click", async () => {
      if (!tracks.length) return;

      if (!audio.src) {
        await playTrack(currentIndex < 0 ? 0 : currentIndex);
      } else if (audio.paused) {
        try {
          await audio.play();
          playPauseButton.textContent = "⏸ Pauza";
          status.textContent = "";
        } catch (error) {
          status.textContent = "Pesma ne može da se pusti. Proveri da li se MP3 fajl otvara direktno.";
        }
      } else {
        audio.pause();
      }
    });

    shuffleButton.addEventListener("click", () => {
      shuffleOn = !shuffleOn;
      shuffleButton.setAttribute("aria-pressed", String(shuffleOn));
      shuffleButton.textContent = shuffleOn
        ? "🔀 Nasumično: uključeno"
        : "🔀 Nasumično: isključeno";
    });

    search.addEventListener("input", renderTracks);

    audio.addEventListener("ended", playNext);
    audio.addEventListener("play", () => {
      playPauseButton.textContent = "⏸ Pauza";
    });
    audio.addEventListener("pause", () => {
      playPauseButton.textContent = "▶ Pusti";
    });
    audio.addEventListener("error", () => {
      status.textContent = "Greška pri učitavanju pesme: " +
        (tracks[currentIndex] || "proveri MP3 fajl i njegov naziv");
    });

    loadTracks();
  </script>
</body>
</html>
