<!doctype html>
<html lang="bs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moja muzika</title>
  <style>
    body {
      max-width: 760px;
      margin: 30px auto;
      padding: 0 16px;
      font: 16px/1.5 system-ui, sans-serif;
      color: #222;
      background: #f7f7f7;
    }

    audio {
      display: block;
      width: 100%;
      margin: 12px 0;
    }

    #search {
      box-sizing: border-box;
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      font: inherit;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0;
    }

    button {
      padding: 8px 12px;
      cursor: pointer;
    }

    #status {
      color: #555;
      overflow-wrap: anywhere;
    }

    ol { padding-left: 34px; }

    button.track {
      border: 0;
      padding: 5px 8px;
      font: inherit;
      text-align: left;
      color: #174ea6;
      background: transparent;
      cursor: pointer;
    }

    button.track:hover,
    button.track.active {
      color: #b00020;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Moja muzika</h1>
  <div id="status">Učitavam pjesme…</div>

  <audio id="player" controls preload="none"></audio>

  <div class="controls">
    <button id="start" type="button">▶ Pusti muziku</button>
    <button id="previous" type="button">⏮ Prethodna</button>
    <button id="next" type="button">Sljedeća ⏭</button>
    <button id="shuffle" type="button">🔀 Nasumično: isključeno</button>
  </div>

  <input id="search" type="search" placeholder="Pretraži pjesme…">
  <ol id="playlist"></ol>

  <script>
    const owner = "velimir62";
    const repository = "moja-muzika";

    const player = document.getElementById("player");
    const playlist = document.getElementById("playlist");
    const status = document.getElementById("status");
    const search = document.getElementById("search");
    const shuffleButton = document.getElementById("shuffle");

    let tracks = [];
    let branch = "";
    let currentIndex = -1;
    let shuffle = false;

    function fileUrl(path) {
      const encodedPath = path
        .split("/")
        .map(part => encodeURIComponent(part))
        .join("/");

      return `https://raw.githubusercontent.com/${owner}/${repository}/${branch}/${encodedPath}`;
    }

    async function loadTracks() {
      for (const possibleBranch of ["master", "main"]) {
        try {
          const url =
            `https://api.github.com/repos/${owner}/${repository}` +
            `/git/trees/${possibleBranch}?recursive=1`;

          const response = await fetch(url);

          if (!response.ok) continue;

          const data = await response.json();

          if (data.message || !Array.isArray(data.tree)) continue;

          branch = possibleBranch;
          tracks = data.tree
            .filter(file =>
              file.type === "blob" &&
              /\.mp3$/i.test(file.path)
            )
            .sort((a, b) =>
              a.path.localeCompare(b.path, undefined, {
                numeric: true,
                sensitivity: "base"
              })
            );

          if (tracks.length) {
            renderPlaylist();
            status.textContent =
              `Pronađeno MP3 pjesama: ${tracks.length}. Izaberi pjesmu.`;
            return;
          }
        } catch (error) {
          // Pokušaj sljedeću granu.
        }
      }

      status.textContent =
        "Nisam pronašao MP3 fajlove. Provjeri da je repozitorijum javan.";
    }

    function renderPlaylist() {
      const query = search.value.trim().toLocaleLowerCase();
      playlist.replaceChildren();

      tracks.forEach((track, index) => {
        const name = track.path.split("/").pop();

        if (!name.toLocaleLowerCase().includes(query)) return;

        const item = document.createElement("li");
        const button = document.createElement("button");

        button.type = "button";
        button.className = "track";
        button.textContent = name;

        if (index === currentIndex) {
          button.classList.add("active");
        }

        button.addEventListener("click", () => playTrack(index));
        item.appendChild(button);
        playlist.appendChild(item);
      });
    }

    async function playTrack(index) {
      if (index < 0 || index >= tracks.length) return;

      currentIndex = index;
      const track = tracks[index];
      const name = track.path.split("/").pop();

      player.pause();
      player.src = fileUrl(track.path);
      player.load();
      renderPlaylist();
      status.textContent = `Učitavam: ${name}`;

      try {
        await player.play();
        status.textContent = `Sada svira: ${name}`;
      } catch (error) {
        showFileError(name, error.name || error.message);
      }
    }

    function showFileError(name, reason) {
      status.replaceChildren();

      const text = document.createElement("span");
      text.textContent = `Ne mogu pustiti "${name}" (${reason}). Fajl: `;
      status.appendChild(text);

      if (currentIndex >= 0 && tracks[currentIndex]) {
        const link = document.createElement("a");
        link.href = fileUrl(tracks[currentIndex].path);
        link.textContent = "otvori/preuzmi MP3";
        link.target = "_blank";
        link.rel = "noopener";
        status.appendChild(link);
      }
    }

    function nextTrack() {
      if (!tracks.length) return;

      if (shuffle && tracks.length > 1) {
        let nextIndex;
        do {
          nextIndex = Math.floor(Math.random() * tracks.length);
        } while (nextIndex === currentIndex);

        playTrack(nextIndex);
      } else {
        playTrack((currentIndex + 1) % tracks.length);
      }
    }

    document.getElementById("start").addEventListener("click", () => {
      if (currentIndex === -1) {
        playTrack(0);
      } else {
        player.play().catch(error => {
          showFileError(
            tracks[currentIndex].path.split("/").pop(),
            error.name || error.message
          );
        });
      }
    });

    document.getElementById("previous").addEventListener("click", () => {
      if (!tracks.length) return;
      playTrack((currentIndex - 1 + tracks.length) % tracks.length);
    });

    document.getElementById("next").addEventListener("click", nextTrack);

    shuffleButton.addEventListener("click", () => {
      shuffle = !shuffle;
      shuffleButton.textContent =
        `🔀 Nasumično: ${shuffle ? "uključeno" : "isključeno"}`;
    });

    search.addEventListener("input", renderPlaylist);
    player.addEventListener("ended", nextTrack);

    player.addEventListener("error", () => {
      if (currentIndex >= 0 && tracks[currentIndex]) {
        const name = tracks[currentIndex].path.split("/").pop();
        const code = player.error ? player.error.code : "nepoznat";
        showFileError(name, `greška playera ${code}`);
      }
    });

    loadTracks();
  </script>
</body>
</html>
