<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VELJO-RADIO</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #0b1020;
    color: #eeeeee;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    max-width: 850px;
    margin: 0 auto;
}

h1 {
    text-align: center;
    color: #e94560;
    font-size: 38px;
    margin: 10px 0 5px;
}

.subtitle {
    text-align: center;
    color: #999;
    margin-bottom: 20px;
}

.nav {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.nav a {
    flex: 1;
    padding: 14px;
    text-align: center;
    text-decoration: none;
    color: white;
    background: #163d6b;
    border-radius: 9px;
    font-weight: bold;
}

.nav a.active {
    background: #e94560;
}

.player-box {
    background: #16213e;
    padding: 20px;
    border-radius: 15px;
}

.now-playing {
    text-align: center;
    color: #e94560;
    font-weight: bold;
    font-size: 18px;
    margin-bottom: 15px;
    min-height: 24px;
}

audio {
    display: block;
    width: 100%;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 15px;
}

button {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: #e94560;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    background: #ff5570;
}

.playlist-title {
    margin-top: 25px;
    color: #e94560;
    font-size: 20px;
    font-weight: bold;
}

#playlist {
    list-style: none;
    padding: 0;
}

#playlist li {
    background: #16213e;
    margin: 8px 0;
    padding: 14px 16px;
    border-radius: 9px;
    cursor: pointer;
    transition: 0.2s;
}

#playlist li:hover {
    background: #0f3460;
}

#playlist li.active {
    background: #0f3460;
    border-left: 5px solid #e94560;
}

.status {
    text-align: center;
    color: #888;
    margin-top: 20px;
}

.error {
    color: #ff4d6d;
}

@media (max-width: 600px) {
    body {
        padding: 10px;
    }

    h1 {
        font-size: 29px;
    }

    .nav,
    .buttons {
        flex-direction: column;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>🎵 VELJO-RADIO</h1>

    <div class="subtitle">
        My Media Center
    </div>

    <div class="nav">

        <a href="https://velimir62.github.io/moja-muzika/"
           class="active">
            🎵 VELJO-RADIO
        </a>

        <a href="https://velimir62.github.io/veljo-video-muzika/">
            🎬 VELJO-VIDEO
        </a>

    </div>

    <div class="player-box">

        <div id="nowPlaying" class="now-playing">
            🎵 Učitavanje muzike...
        </div>

        <audio id="player"
               controls
               preload="metadata">
        </audio>

        <div class="buttons">

            <button id="play">
                ▶ Pokreni
            </button>

            <button id="prev">
                ⏮ Prethodna
            </button>

            <button id="next">
                Sljedeća ⏭
            </button>

        </div>

    </div>

    <div class="playlist-title">
        🎵 Muzička lista
    </div>

    <ul id="playlist"></ul>

    <div id="status" class="status">
        Učitavanje...
    </div>

</div>

<script>

const API_URL =
    "https://api.github.com/repos/velimir62/moja-muzika/contents/";

const player =
    document.getElementById("player");

const playlist =
    document.getElementById("playlist");

const nowPlaying =
    document.getElementById("nowPlaying");

const status =
    document.getElementById("status");

const playButton =
    document.getElementById("play");

const prevButton =
    document.getElementById("prev");

const nextButton =
    document.getElementById("next");

let songs = [];
let current = -1;


/*
    UČITAJ MP3 FAJLOVE
*/

async function loadSongs() {

    const response =
        await fetch(API_URL, {
            cache: "no-store"
        });

    if (!response.ok) {
        throw new Error(
            "GitHub nije mogao učitati listu muzike."
        );
    }

    const files =
        await response.json();

    /*
        UZIMAMO SAMO MP3 IZ GLAVNOG
        FOLDERA REPOZITORIJA.
    */

    songs = files
        .filter(file =>
            file.type === "file" &&
            /\.mp3$/i.test(file.name)
        )
        .map(file => ({

            name: file.name,

            title: file.name.replace(
                /\.mp3$/i,
                ""
            ),

            url:
                "https://raw.githubusercontent.com/" +
                "velimir62/moja-muzika/" +
                "main/" +
                encodeURIComponent(file.name)
                    .replace(/%2F/g, "/")
        }));


    /*
        SORTIRANJE
    */

    songs.sort((a, b) =>
        a.title.localeCompare(
            b.title,
            undefined,
            {
                numeric: true,
                sensitivity: "base"
            }
        )
    );
}


/*
    PRIKAŽI PLAYLISTU
*/

function showPlaylist() {

    playlist.innerHTML = "";

    songs.forEach((song, index) => {

        const li =
            document.createElement("li");

        li.textContent =
            "🎵 " + song.title;

        li.addEventListener(
            "click",
            function () {
                playSong(index);
            }
        );

        playlist.appendChild(li);
    });

    status.textContent =
        songs.length +
        " MP3 fajlova pronađeno";
}


/*
    POKRENI PJESMU
*/

function playSong(index) {

    if (
        index < 0 ||
        index >= songs.length
    ) {
        return;
    }

    current = index;

    player.src =
        songs[current].url;

    player.load();

    nowPlaying.textContent =
        "🎵 " +
        songs[current].title +
        " (" +
        (current + 1) +
        " / " +
        songs.length +
        ")";

    document.title =
        songs[current].title +
        " - VELJO-RADIO";


    /*
        OZNAČI AKTIVNU PJESMU
    */

    Array.from(
        playlist.children
    ).forEach(function (li) {
        li.classList.remove("active");
    });


    const active =
        playlist.children[current];

    if (active) {

        active.classList.add("active");

        active.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });
    }
}


/*
    POKRENI DUGME
*/

playButton.addEventListener(
    "click",
    function () {

        if (songs.length === 0) {
            return;
        }

        if (current === -1) {
            playSong(0);
        }

        player.play().catch(function () {});
    }
);


/*
    PRETHODNA
*/

prevButton.addEventListener(
    "click",
    function () {

        if (current > 0) {

            playSong(current - 1);

            player.play().catch(function () {});
        }
    }
);


/*
    SLJEDEĆA
*/

nextButton.addEventListener(
    "click",
    function () {

        if (
            current < songs.length - 1
        ) {

            playSong(current + 1);

            player.play().catch(function () {});
        }
    }
);


/*
    KADA PJESMA ZAVRŠI
    AUTOMATSKI SLJEDEĆA
*/

player.addEventListener(
    "ended",
    function () {

        if (
            current < songs.length - 1
        ) {

            playSong(current + 1);

            player.play().catch(function () {});
        }
    }
);


/*
    TIPKE LIJEVO / DESNO
*/

document.addEventListener(
    "keydown",
    function (event) {

        if (
            event.key === "ArrowRight" &&
            current < songs.length - 1
        ) {

            playSong(current + 1);
        }

        if (
            event.key === "ArrowLeft" &&
            current > 0
        ) {

            playSong(current - 1);
        }
    }
);


/*
    START
*/

async function start() {

    try {

        status.textContent =
            "Učitavanje MP3 fajlova...";

        await loadSongs();


        if (songs.length === 0) {

            nowPlaying.textContent =
                "🎵 Nema MP3 fajlova";

            status.textContent =
                "Nijedan MP3 nije pronađen.";

            return;
        }


        showPlaylist();


        nowPlaying.textContent =
            "🎵 " +
            songs.length +
            " MP3 fajlova spremno";


    } catch (error) {

        console.error(error);

        nowPlaying.innerHTML =
            '<span class="error">' +
            "❌ Greška pri učitavanju muzike" +
            "</span>";

        status.textContent =
            error.message;
    }
}


start();

</script>

</body>
</html>
