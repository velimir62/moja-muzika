```html
<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Veljo Radio</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 16px 12px; min-height: 100vh;
  font-family: Arial, sans-serif; color: white;
  background: linear-gradient(135deg,#101426,#1b3150);
}
.container {
  max-width: 720px; margin: 20px auto; padding: 22px;
  background: #18243bd9; border-radius: 22px;
}
h1, .subtitle { text-align: center; }
.subtitle { color: #bdcbe0; }
#nowPlaying {
  padding: 15px; border-radius: 12px;
  background: #101a2d; text-align: center;
  overflow-wrap: anywhere;
}
#status {
  padding: 10px 0; text-align: center;
  color: #cbd5e1; overflow-wrap: anywhere;
}
audio { width: 100%; margin: 12px 0; }
.controls {
  display: flex; flex-wrap: wrap; gap: 8px;
  justify-content: center; margin: 12px 0;
}
button {
  padding: 12px 14px; border: 0; border-radius: 10px;
  background: #30415e; color: white; font-size: 15px;
  cursor: pointer;
}
#playPause, #shuffle.active {
  background: #1db954; color: #071b0e;
}
input {
  width: 100%; padding: 13px; margin: 10px 0;
  border: 1px solid #465777; border-radius: 10px;
  background: #101a2d; color: white; font-size: 16px;
}
#trackList {
  list-style: none; padding: 0; max-height: 440px;
  overflow-y: auto;
}
#trackList li { margin: 6px 0; }
.track {
  width: 100%; text-align: left;
  overflow-wrap: anywhere;
}
.track.current { background: #1db954; color: #071b0e; }
@media(max-width:480px) {
  .container { padding: 14px; }
  .controls button { flex: 1 1 40%; }
}
</style>
</head>
<body>
<main class="container">
  <h1>🎵 Veljo Radio</h1>
  <p class="subtitle">Tvoja muzika — radio bez kraja</p>

  <div id="nowPlaying">Učitavam radio...</div>
  <audio id="audio" controls preload="none"></audio>

  <div class="controls">
    <button id="previous">⏮ Prethodna</button>
    <button id="playPause">▶ Pusti</button>
    <button id="next">Sljedeća ⏭</button>
    <button id="shuffle" aria-pressed="false">🔀 Nasumično: NE</button>
  </div>

  <div id="status" role="status" aria-live="polite">
    Tražim pjesme na GitHubu...
  </div>

  <input id="search" type="search" placeholder="🔎 Traži pjesmu...">
  <ul id="trackList"></ul>
</main>

<script>
"use strict";

const OWNER = "velimir62";
const REPO = "moja-muzika";
const BRANCH = "40ef727e4eb93f9ce26521807134fc29c254c536";

const audio = document.getElementById("audio");
const status = document.getElementById("status");
const nowPlaying = document.getElementById("nowPlaying");
const trackList = document.getElementById("trackList");
const search = document.getElementById("search");
const playButton = document.getElementById("playPause");
const shuffleButton = document.getElementById("shuffle");

let tracks = [];
let currentIndex = -1;
let shuffle = false;
let busy = false;

function say(text) {
  status.textContent = text;
}

function titleOf(track) {
  return track.name.replace(/\.mp3$/i, "");
}

function renderTracks() {
  const query = search.value.trim().toLocaleLowerCase();
  trackList.replaceChildren();

  tracks.forEach((track, index) => {
    if (!titleOf(track).toLocaleLowerCase().includes(query)) return;

    const li = document.createElement("li");
    const button = document.createElement("button");

    button.className =
      "track" + (index === currentIndex ? " current" : "");
    button.textContent = "🎵 " + titleOf(track);
    button.title = track.path;
    button.addEventListener("click", () => playTrack(index));

    li.appendChild(button);
    trackList.appendChild(li);
  });

  if (!trackList.children.length) {
    const li = document.createElement("li");
    li.textContent = "Nema pronađenih pjesama.";
    trackList.appendChild(li);
  }
}

async function loadTracks() {
  say("Tražim MP3 datoteke u svim direktorijima...");

  try {
    const url =
      `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`;

    const response = await fetch(url, {
      headers: { Accept: "application/vnd.github+json" },
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("GitHub odgovor: " + response.status);
    }

    const data = await response.json();

    if (!Array.isArray(data.tree)) {
      throw new Error("GitHub nije vratio listu datoteka.");
    }

    if (data.truncated) {
      throw new Error("GitHub lista je prevelika i skraćena.");
    }

    tracks = data.tree
      .filter(file => file.type === "blob" && /\.mp3$/i.test(file.path) && file.size > 1000)
      .map(file => ({
        name: file.path.split("/").pop(),
        path: file.path,
        url: "https://raw.githubusercontent.com/" +
          OWNER + "/" + REPO + "/" + BRANCH + "/" +
          file.path.split("/").map(encodeURIComponent).join("/")
      }))
      .sort((a, b) =>
        a.path.localeCompare(b.path, "sr", { numeric: true })
      );

    if (!tracks.length) {
      throw new Error("Nema MP3 datoteka u grani master.");
    }

    renderTracks();
    say("Pronađeno pjesama: " + tracks.length);
    nowPlaying.textContent = "Izaberi pjesmu sa liste.";
  } catch (error) {
    console.error(error);
    say("Greška pri traženju pjesama: " + error.message);
    nowPlaying.textContent = "Lista pjesama nije učitana.";
  }
}

async function playTrack(index) {
  if (busy || !tracks.length) return;

  busy = true;
  currentIndex = (index + tracks.length) % tracks.length;
  const track = tracks[currentIndex];

  audio.pause();
  audio.removeAttribute("src");
  audio.load();

  nowPlaying.textContent = "🎵 " + track.name;
  renderTracks();
  playButton.textContent = "▶ Pusti";
  say("Učitavam: " + track.path);

  try {
    await new Promise((resolve, reject) => {
      let finished = false;

      function cleanup() {
        clearTimeout(timer);
        audio.removeEventListener("canplay", onReady);
        audio.removeEventListener("error", onError);
      }

      function finish(callback, value) {
        if (finished) return;
        finished = true;
        cleanup();
        callback(value);
      }

      function onReady() {
        finish(resolve);
      }

      function onError() {
        finish(reject, new Error(
          "MP3 nije dostupan ili nije podržan. Datoteka: " +
          track.path + ". Provjeri direktni link: " + track.url
        ));
      }

      const timer = setTimeout(() => {
        finish(reject, new Error(
          "Učitavanje traje predugo. Provjeri datoteku: " + track.path
        ));
      }, 20000);

      audio.addEventListener("canplay", onReady);
      audio.addEventListener("error", onError);

      audio.src = track.url;
      audio.load();
    });

    await audio.play();
    say("Sada svira: " + track.name);
    playButton.textContent = "⏸ Pauza";
  } catch (error) {
    console.error(error);
    say(error.message);
    nowPlaying.textContent = "Ne mogu pustiti: " + track.name;
  } finally {
    busy = false;
  }
}

function nextTrack() {
  if (!tracks.length || busy) return;

  let index;

  if (shuffle && tracks.length > 1) {
    do {
      index = Math.floor(Math.random() * tracks.length);
    } while (index === currentIndex);
  } else {
    index = (currentIndex + 1) % tracks.length;
  }

  playTrack(index);
}

function previousTrack() {
  if (!tracks.length || busy) return;

  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }

  playTrack((currentIndex - 1 + tracks.length) % tracks.length);
}

playButton.addEventListener("click", async () => {
  if (!tracks.length) {
    await loadTracks();
    return;
  }

  if (audio.paused) {
    if (currentIndex < 0 || !audio.src) {
      playTrack(0);
    } else {
      try {
        await audio.play();
      } catch (error) {
        say("Reprodukcija nije uspjela: " + error.message);
      }
    }
  } else {
    audio.pause();
  }
});

document.getElementById("next").addEventListener("click", nextTrack);
document.getElementById("previous").addEventListener("click", previousTrack);

shuffleButton.addEventListener("click", () => {
  shuffle = !shuffle;
  shuffleButton.classList.toggle("active", shuffle);
  shuffleButton.textContent =
    shuffle ? "🔀 Nasumično: DA" : "🔀 Nasumično: NE";
  shuffleButton.setAttribute("aria-pressed", String(shuffle));
});

search.addEventListener("input", renderTracks);

audio.addEventListener("ended", nextTrack);

audio.addEventListener("play", () => {
  playButton.textContent = "⏸ Pauza";
});

audio.addEventListener("pause", () => {
  playButton.textContent = "▶ Pusti";
});

// Namjerno ne preskače automatski neispravnu datoteku.
// Prikazuje grešku umjesto vrćenja kroz cijelu listu.
audio.addEventListener("error", () => {
  if (currentIndex >= 0) {
    say("Greška zvuka. Provjeri MP3 link za: " +
      tracks[currentIndex].path);
  }
});

loadTracks();
</script>
</body>
</html>
