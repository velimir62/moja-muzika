<style>

<body>
<main class="container">
  <nav style="text-align:center;margin:0 auto 14px;"><a href="https://velimir62.github.io/veljo-video-muzika/" style="display:inline-block;padding:12px 18px;border-radius:10px;background:#1db954;color:#071b0e;text-decoration:none;font-weight:bold;">🎬 OTVORI VIDEO</a></nav>

    Tražim pjesme na GitHubu...
  </div>

  <input id="search" type="search" placeholder="🔎 Traži pjesmu...">

</main>

<script>
"use strict";

const OWNER = "velimir62";
const REPO = "moja-muzika";
const BRANCH = "40ef727e4eb93f9ce26521807134fc29c254c536";

const audio = document.getElementById("audio");
const status = document.getElementById("status");
const nowPlaying = document.getElementById("nowPlaying");
const trackList = document.getElementById("trackList");
const search = document.getElementById("search");
const playButton = document.getElementById("playPause");
const shuffleButton = document.getElementById("shuffle");

let tracks = [];
let currentIndex = -1;
let shuffle = false;
let busy = false;
let adUrl = "";
let isPlayingAd = false;
let completedSongsSinceAd = 0;

function say(text) {
  status.textContent = text;
}

function titleOf(track) {
  return track.name.replace(/\.mp3$/i, "");
}

function renderTracks() {
  const query = search.value.trim().toLocaleLowerCase();
  trackList.replaceChildren();

  tracks.forEach((track, index) => {
    if (!titleOf(track).toLocaleLowerCase().includes(query)) return;

    const li = document.createElement("li");
    const button = document.createElement("button");

    button.className =
      "track" + (index === currentIndex ? " current" : "");
    button.textContent = (track.available ? "🎵 " : "⚠️ ") + titleOf(track) + (track.available ? "" : " (snimak nedostaje)");
    button.title = track.path;
    button.addEventListener("click", () => playTrack(index));

    li.appendChild(button);
    trackList.appendChild(li);
  });

  if (!trackList.children.length) {
    const li = document.createElement("li");
    li.textContent = "Nema pronađenih pjesama.";
    trackList.appendChild(li);
  }
}

async function loadTracks() {
  say("Učitavam redoslijed 001–121 i tražim sačuvane snimke...");

  try {
    const headers = { Accept: "application/vnd.github+json" };
    // Git Trees API traži SHA stabla, a ne SHA commita.
    // Prvo učitajmo commit-e, pa iz njih stvarne tree SHA vrijednosti.
    const currentCommitResponse = await fetch(
      `https://api.github.com/repos/${OWNER}/${REPO}/commits/master`,
      { headers, cache: "no-store" }
    );
    const archiveCommitResponse = await fetch(
      "https://api.github.com/repos/" + OWNER + "/" + REPO +
        "/commits/40ef727e4eb93f9ce26521807134fc29c254c536",
      { headers, cache: "no-store" }
    );

    if (!currentCommitResponse.ok || !archiveCommitResponse.ok) {
      throw new Error("GitHub commit odgovor: " +
        (!currentCommitResponse.ok ? currentCommitResponse.status : archiveCommitResponse.status));
    }

    const [currentCommit, archiveCommit] = await Promise.all([
      currentCommitResponse.json(), archiveCommitResponse.json()
    ]);
    const [currentResponse, archiveResponse] = await Promise.all([
      fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${currentCommit.commit.tree.sha}?recursive=1`,
        { headers, cache: "no-store" }),
      fetch(`https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${archiveCommit.commit.tree.sha}?recursive=1`,
        { headers, cache: "no-store" })
    ]);

    if (!currentResponse.ok || !archiveResponse.ok) {
      throw new Error("GitHub lista datoteka: " +
        (!currentResponse.ok ? currentResponse.status : archiveResponse.status));
    }

    const currentData = await currentResponse.json();
    const archiveData = await archiveResponse.json();
    if (!Array.isArray(currentData.tree) || !Array.isArray(archiveData.tree)) {
      throw new Error("GitHub nije vratio listu datoteka.");
    }

    const currentFiles = currentData.tree.filter(file =>
      file.type === "blob" && /\.mp3$/i.test(file.path)
    );
    const archivedFiles = archiveData.tree.filter(file =>
      file.type === "blob" && /\.mp3$/i.test(file.path) && file.size > 1000
    );

    function cleanTitle(path, archived = false) {
      let name = path.split("/").pop().replace(/\.mp3$/i, "");
      name = name.replace(/^\d{3}\s*/, "");
      if (archived) name = name.replace(/^\d+[\s._-]*/, "");
      name = name.replace(/^[AB]+\d*[\s._-]*/i, "");
      return name.normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .toLocaleLowerCase().replace(/[^a-z0-9а-яёђћжшчћџљњ]/gi, "");
    }

    function findArchiveMatch(file) {
      const wanted = cleanTitle(file.path);
      if (!wanted) return null;

      const candidates = archivedFiles.map(candidate => {
        const title = cleanTitle(candidate.path, true);
        let score = 0;
        if (title === wanted) score = 1000;
        else if (title.length >= 4 && wanted.includes(title)) score = 700 + title.length;
        else if (wanted.length >= 4 && title.includes(wanted)) score = 700 + wanted.length;
        return { candidate, score };
      }).filter(item => item.score > 0)
        .sort((a, b) => b.score - a.score);

      return candidates.length ? candidates[0].candidate : null;
    }

    const adFile = currentFiles.find(file =>
      file.path.split("/").pop().toLocaleLowerCase() === "m.mp3"
    );
    adUrl = adFile && adFile.size > 1000
      ? "https://raw.githubusercontent.com/" + OWNER + "/" + REPO +
        "/master/" + adFile.path.split("/").map(encodeURIComponent).join("/")
      : "";

    tracks = currentFiles.filter(file =>
      file.path.split("/").pop().toLocaleLowerCase() !== "m.mp3"
    ).map(file => {
      const archiveMatch = file.size > 1000 ? null : findArchiveMatch(file);
      const source = file.size > 1000 ? file : archiveMatch;
      return {
        name: file.path.split("/").pop(),
        path: file.path,
        url: source ? "https://raw.githubusercontent.com/" +
          OWNER + "/" + REPO + "/" +
          (file.size > 1000 ? "master" : "40ef727e4eb93f9ce26521807134fc29c254c536") + "/" +
          source.path.split("/").map(encodeURIComponent).join("/") : "",
        available: Boolean(source),
        order: (file.path.match(/^(\d{3})\s/) || [null, "999"])[1]
      };
    }).sort((a, b) => {
      const aNumbered = /^\d{3}\s/.test(a.name);
      const bNumbered = /^\d{3}\s/.test(b.name);
      if (aNumbered && bNumbered) return Number(a.order) - Number(b.order);
      if (aNumbered) return -1;
      if (bNumbered) return 1;
      if (a.name === "M.mp3") return -1;
      if (b.name === "M.mp3") return 1;
      return a.name.localeCompare(b.name, "sr");
    });

    if (!tracks.length) throw new Error("Nema MP3 datoteka u repozitorijumu.");

    renderTracks();
    const playable = tracks.filter(track => track.available).length;
    say("Dostupno pjesama: " + playable + " od " + tracks.length +
      (adUrl ? ". Reklama m.mp3 nakon svake 2 završene pjesme." :
      ". Upozorenje: m.mp3 reklama nije pronađena ili je prazna."));
    nowPlaying.textContent = "Izaberi pjesmu sa liste.";
  } catch (error) {
    console.error(error);
    say("Greška pri traženju pjesama: " + error.message);
    nowPlaying.textContent = "Lista pjesama nije učitana.";
  }
}
async function playTrack(index) {
  if (busy || !tracks.length) return;

  isPlayingAd = false;
  busy = true;
  currentIndex = (index + tracks.length) % tracks.length;
  const track = tracks[currentIndex];
  if (!track.available || !track.url) {
    renderTracks();
    nowPlaying.textContent = "⚠️ " + track.name;
    say("Za ovu pjesmu nema ispravnog snimka ni u starijoj verziji GitHuba.");
    busy = false;
    return;
  }

  audio.pause();
  audio.removeAttribute("src");
  audio.load();

  nowPlaying.textContent = "🎵 " + track.name;
  renderTracks();
  playButton.textContent = "▶ Pusti";
  say("Učitavam: " + track.path);

  try {
    await new Promise((resolve, reject) => {
      let finished = false;

      function cleanup() {
        clearTimeout(timer);
        audio.removeEventListener("canplay", onReady);
        audio.removeEventListener("error", onError);
      }

      function finish(callback, value) {
        if (finished) return;
        finished = true;
        cleanup();
        callback(value);
      }

      function onReady() {
        finish(resolve);
      }

      function onError() {
        finish(reject, new Error(
          "MP3 nije dostupan ili nije podržan. Datoteka: " +
          track.path + ". Provjeri direktni link: " + track.url
        ));
      }

      const timer = setTimeout(() => {
        finish(reject, new Error(
          "Učitavanje traje predugo. Provjeri datoteku: " + track.path
        ));
      }, 20000);

      audio.addEventListener("canplay", onReady);
      audio.addEventListener("error", onError);

      audio.src = track.url;
      audio.load();
    });

    await audio.play();
    say("Sada svira: " + track.name);
    playButton.textContent = "⏸ Pauza";
  } catch (error) {
    console.error(error);
    say(error.message);
    nowPlaying.textContent = "Ne mogu pustiti: " + track.name;
  } finally {
    busy = false;
  }
}

async function playAdvertisement() {
  if (!adUrl) {
    isPlayingAd = false;
    say("Reklama M.mp3 nije pronađena; nastavljam radio.");
    nextTrack();
    return;
  }

  isPlayingAd = true;
  audio.pause();
  audio.removeAttribute("src");
  audio.load();
  nowPlaying.textContent = "📢 Reklama M.mp3";
  renderTracks();
  say("📢 Učitavam reklamu M.mp3...");

  try {
    await new Promise((resolve, reject) => {
      let settled = false;
      const timer = setTimeout(() => finish(reject, new Error("Reklama se nije učitala na vrijeme.")), 15000);

      function cleanup() {
        clearTimeout(timer);
        audio.removeEventListener("canplay", onReady);
        audio.removeEventListener("error", onError);
      }
      function finish(callback, value) {
        if (settled) return;
        settled = true;
        cleanup();
        callback(value);
      }
      function onReady() { finish(resolve); }
      function onError() { finish(reject, new Error("Ne mogu učitati M.mp3.")); }

      audio.addEventListener("canplay", onReady);
      audio.addEventListener("error", onError);
      audio.src = adUrl;
      audio.load();
    });

    await audio.play();
    say("📢 Sada svira reklama M.mp3.");
  } catch (error) {
    console.error(error);
    isPlayingAd = false;
    say("Greška pri puštanju reklame M.mp3; nastavljam radio.");
    nextTrack();
  }
}

function nextTrack() {
  if (!tracks.length || busy) return;
  isPlayingAd = false;

  const playableIndexes = tracks
    .map((track, index) => track.available ? index : -1)
    .filter(index => index >= 0);
  if (!playableIndexes.length) {
    say("Nema ispravnih snimaka za puštanje.");
    return;
  }

  let index;
  if (shuffle && playableIndexes.length > 1) {
    const choices = playableIndexes.filter(i => i !== currentIndex);
    index = choices[Math.floor(Math.random() * choices.length)];
  } else {
    const startAt = currentIndex < 0 ? 0 : currentIndex + 1;
    index = playableIndexes.find(i => i >= startAt);
    if (index === undefined) index = playableIndexes[0];
  }
  playTrack(index);
}
function previousTrack() {
  if (!tracks.length || busy) return;

  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }

  const playableIndexes = tracks
    .map((track, index) => track.available ? index : -1)
    .filter(index => index >= 0);

  if (!playableIndexes.length) {
    say("Nema ispravnih snimaka za puštanje.");
    return;
  }

  // Pronađi prethodnu dostupnu pjesmu i preskoči nedostupne snimke.
  let index = playableIndexes.filter(i => i < currentIndex).pop();
  if (index === undefined) index = playableIndexes[playableIndexes.length - 1];

  playTrack(index);
}

playButton.addEventListener("click", async () => {
  if (!tracks.length) {
    await loadTracks();
    return;
  }

  if (audio.paused) {
    if (currentIndex < 0 || !audio.src) {
      playTrack(0);
    } else {
      try {
        await audio.play();
      } catch (error) {
        say("Reprodukcija nije uspjela: " + error.message);
      }
    }
  } else {
    audio.pause();
  }
});

document.getElementById("next").addEventListener("click", nextTrack);
document.getElementById("previous").addEventListener("click", previousTrack);

shuffleButton.addEventListener("click", () => {
  shuffle = !shuffle;
  shuffleButton.classList.toggle("active", shuffle);
  shuffleButton.textContent =
    shuffle ? "🔀 Nasumično: DA" : "🔀 Nasumično: NE";
  shuffleButton.setAttribute("aria-pressed", String(shuffle));
});

search.addEventListener("input", renderTracks);

audio.addEventListener("ended", () => {
  if (isPlayingAd) {
    isPlayingAd = false;
    say("Reklama završena; nastavljam sljedeću pjesmu.");
    nextTrack();
    return;
  }

  completedSongsSinceAd++;
  if (completedSongsSinceAd >= 2) {
    completedSongsSinceAd = 0;
    playAdvertisement();
  } else {
    say("Pjesma završena (" + completedSongsSinceAd + "/2); nastavljam radio.");
    nextTrack();
  }
});

audio.addEventListener("play", () => {
  playButton.textContent = "⏸ Pauza";
});

audio.addEventListener("pause", () => {
  playButton.textContent = "▶ Pusti";
});

// Namjerno ne preskače automatski neispravnu datoteku.
// Prikazuje grešku umjesto vrćenja kroz cijelu listu.
audio.addEventListener("error", () => {
  if (currentIndex >= 0) {
    say("Greška zvuka. Provjeri MP3 link za: " +
      tracks[currentIndex].path);
  }
});

loadTracks();
</script>
</body>
