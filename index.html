<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veljo Radio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #eee;
            padding: 20px;
        }
        .container {
            max-width: 700px;
            margin: 0 auto;
            background: rgba(0,0,0,0.4);
            border-radius: 32px;
            padding: 24px;
            backdrop-filter: blur(10px);
        }
        h1 { text-align: center; margin-bottom: 20px; font-weight: 600; }
        .radio-btn {
            display: block;
            width: 100%;
            background: #1db954;
            border: none;
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 14px;
            border-radius: 50px;
            cursor: pointer;
            text-align: center;
            margin-bottom: 15px;
            transition: 0.2s;
        }
        .radio-btn:hover { background: #1ed760; transform: scale(1.02); }
        .status {
            text-align: center;
            font-size: 14px;
            color: #ccc;
            margin-bottom: 20px;
        }
        .playlist {
            max-height: 500px;
            overflow-y: auto;
            border-top: 1px solid #333;
            margin-top: 10px;
        }
        .song-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: #2a2a4a;
            border: none;
            color: #eee;
            padding: 10px 15px;
            margin: 6px 0;
            border-radius: 40px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.1s;
        }
        .song-btn:hover { background: #e94560; transform: translateX(5px); }
        audio { width: 100%; margin-top: 15px; display: none; }
        footer { text-align: center; margin-top: 20px; font-size: 12px; opacity: 0.7; }
    </style>
</head>
<body>
<div class="container">
    <h1>🎵 Veljo Radio</h1>
    <button id="radioBtn" class="radio-btn">▶️ POKRENI LIVE RADIO</button>
    <div id="radioStatus" class="status">⏳ Učitavam pjesme...</div>
    <div id="songListContainer" class="playlist"></div>
    <audio id="globalPlayer" controls style="display: none;"></audio>
    <footer>Pjesme se automatski učitavaju. Dodaj MP3 u repozitorij – sam se pojavi.</footer>
</div>

<script>
    const REPO_OWNER = "velimir62";
    const REPO_NAME = "moja-muzika";
    const radioBtn = document.getElementById('radioBtn');
    const radioStatus = document.getElementById('radioStatus');
    const container = document.getElementById('songListContainer');
    const player = document.getElementById('globalPlayer');

    let songs = [];
    let radioActive = false;
    let currentIndex = 0;

    async function loadSongs() {
        try {
            radioStatus.innerHTML = '⏳ Učitavam listu pjesama...';
            const apiUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/`;
            const response = await fetch(apiUrl);
            if (!response.ok) throw new Error('Ne mogu dohvatiti listu');
            const files = await response.json();

            const mp3Files = files.filter(f => f.name.toLowerCase().endsWith('.mp3'));
            if (mp3Files.length === 0) throw new Error('Nema MP3 fajlova');

            mp3Files.sort((a,b) => a.name.localeCompare(b.name));

            songs = mp3Files.map(f => ({
                display: f.name.replace(/\.mp3$/i, '').replace(/[_-]/g, ' '),
                url: f.download_url
            }));

            renderSongs();
            radioStatus.innerHTML = `✅ Učitano ${songs.length} pjesama. Pritisni dugme za radio.`;
        } catch (err) {
            console.error(err);
            radioStatus.innerHTML = '❌ Greška pri učitavanju. Provjeri repozitorijum.';
        }
    }

    function renderSongs() {
        container.innerHTML = '';
        songs.forEach((song, idx) => {
            const btn = document.createElement('button');
            btn.textContent = `🎵 ${song.display}`;
            btn.className = 'song-btn';
            btn.onclick = () => {
                if (radioActive) {
                    radioActive = false;
                    radioBtn.innerHTML = '▶️ POKRENI LIVE RADIO';
                }
                currentIndex = idx;
                player.src = song.url;
                player.play();
                radioStatus.innerHTML = `🎵 Svira: ${song.display}`;
            };
            container.appendChild(btn);
        });
    }

    function startRadio() {
        if (songs.length === 0) return;
        if (currentIndex >= songs.length) currentIndex = 0;
        const song = songs[currentIndex];
        player.src = song.url;
        player.play();
        radioActive = true;
        radioBtn.innerHTML = '⏸️ ZAUSTAVI RADIO';
        radioStatus.innerHTML = `🎙️ Radio svira: ${song.display}`;
    }

    function stopRadio() {
        radioActive = false;
        radioBtn.innerHTML = '▶️ POKRENI LIVE RADIO';
        radioStatus.innerHTML = '⏸️ Radio pauziran.';
        player.pause();
    }

    player.addEventListener('ended', function() {
        if (radioActive) {
            currentIndex++;
            if (currentIndex >= songs.length) {
                radioActive = false;
                radioBtn.innerHTML = '▶️ POKRENI LIVE RADIO';
                radioStatus.innerHTML = '🏁 Kraj plejliste';
                player.pause();
                return;
            }
            const next = songs[currentIndex];
            player.src = next.url;
            player.play();
            radioStatus.innerHTML = `🎙️ Radio svira: ${next.display}`;
        }
    });

    radioBtn.addEventListener('click', () => {
        if (radioActive) stopRadio();
        else startRadio();
    });

    loadSongs();
</script>
</body>
</html>
