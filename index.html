<body>

<div class="container">

    <h1>🎵 VELJO-RADIO</h1>

    <div class="subtitle">
        My Media Center
    </div>

    <div class="nav">

        <a href="https://velimir62.github.io/moja-muzika/"
           class="active">
            🎵 VELJO-RADIO
        </a>

        <a href="https://velimir62.github.io/veljo-video-muzika/">
            🎬 VELJO-VIDEO
        </a>

    </div>

    <div class="player-box">

        <div id="nowPlaying" class="now-playing">
            🎵 Učitavanje muzike...
        </div>

        <audio id="player" controls preload="metadata"></audio>

        <div class="buttons">

            <button id="play">
                ▶ Pokreni
            </button>

            <button id="prev">
                ⏮ Prethodna
            </button>

            <button id="next">
                Sljedeća ⏭
            </button>

        </div>

    </div>

    <input
        id="search"
        class="search"
        type="search"
        placeholder="🔎 Pretraži pjesme..."
        autocomplete="off"
    >

    <div class="playlist-title">
        🎵 Muzička lista
    </div>

    <ul id="playlist"></ul>

    <div id="status" class="status">
        Učitavanje...
    </div>

</div>

<script>

/* =========================================================
   PODEŠAVANJA
   ========================================================= */

const USER = "velimir62";
const REPO = "moja-muzika";
const BRANCH = "master";

const API =
    "https://api.github.com/repos/" +
    USER +
    "/" +
    REPO +
    "/contents/?ref=" +
    BRANCH;


/* =========================================================
   ELEMENTI
   ========================================================= */

const player =
    document.getElementById("player");

const playlist =
    document.getElementById("playlist");

const nowPlaying =
    document.getElementById("nowPlaying");

const status =
    document.getElementById("status");

const search =
    document.getElementById("search");

const playButton =
    document.getElementById("play");

const prevButton =
    document.getElementById("prev");

const nextButton =
    document.getElementById("next");


let songs = [];
let filteredSongs = [];
let current = -1;


/* =========================================================
   UČITAJ MUZIKU SA GITHUBA
   ========================================================= */

async function loadSongs() {

    status.textContent =
        "Učitavanje muzike...";

    const response = await fetch(API, {
        cache: "no-store",
        headers: {
            "Accept": "application/vnd.github+json"
        }
    });

    if (!response.ok) {
        throw new Error(
            "GitHub greška: " +
            response.status
        );
    }

    const files = await response.json();

    if (!Array.isArray(files)) {
        throw new Error(
            "GitHub nije vratio listu fajlova."
        );
    }


    /*
       Uzimamo samo MP3 fajlove
       iz glavnog foldera repozitorijuma.
    */

    songs = files
        .filter(file =>
            file.type === "file" &&
            typeof file.name === "string" &&
            /\.mp3$/i.test(file.name) &&
            file.download_url
        )
        .map(file => ({

            name: file.name,

            title: file.name.replace(
                /\.mp3$/i,
                ""
            ),

            url: file.download_url
        }));


    songs.sort((a, b) =>
        a.title.localeCompare(
            b.title,
            undefined,
            {
                numeric: true,
                sensitivity: "base"
            }
        )
    );

    filteredSongs = [...songs];
}


/* =========================================================
   PRIKAŽI PLAYLISTU
   ========================================================= */

function renderPlaylist() {

    playlist.innerHTML = "";

    filteredSongs.forEach(
        (song, index) => {

            const li =
                document.createElement("li");

            li.textContent =
                "🎵 " + song.title;

            li.addEventListener(
                "click",
                () => {

                    playSong(index);

                    player.play().catch(
                        () => {}
                    );
                }
            );

            playlist.appendChild(li);
        }
    );


    status.innerHTML =
        '<span class="ok">✓ ' +
        filteredSongs.length +
        " pjesama</span>";
}


/* =========================================================
   POKRENI PJESMU
   ========================================================= */

function playSong(index) {

    if (
        index < 0 ||
        index >= filteredSongs.length
    ) {
        return;
    }

    current = index;

    const song =
        filteredSongs[current];

    player.src = song.url;

    player.load();

    nowPlaying.textContent =
        "🎵 " +
        song.title +
        " (" +
        (current + 1) +
        " / " +
        filteredSongs.length +
        ")";

    document.title =
        song.title +
        " - VELJO-RADIO";


    Array.from(
        playlist.children
    ).forEach(li => {
        li.classList.remove("active");
    });


    const active =
        playlist.children[current];

    if (active) {

        active.classList.add("active");

        active.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });
    }
}


/* =========================================================
   PLAY
   ========================================================= */

playButton.addEventListener(
    "click",
    () => {

        if (filteredSongs.length === 0) {
            return;
        }

        if (current === -1) {
            playSong(0);
        }

        player.play().catch(
            () => {}
        );
    }
);


/* =========================================================
   PRETHODNA
   ========================================================= */

prevButton.addEventListener(
    "click",
    () => {

        if (current > 0) {

            playSong(current - 1);

            player.play().catch(
                () => {}
            );
        }
    }
);


/* =========================================================
   SLJEDEĆA
   ========================================================= */

nextButton.addEventListener(
    "click",
    () => {

        if (
            current >= 0 &&
            current < filteredSongs.length - 1
        ) {

            playSong(current + 1);

            player.play().catch(
                () => {}
            );
        }
    }
);


/* =========================================================
   AUTOMATSKI SLJEDEĆA
   ========================================================= */

player.addEventListener(
    "ended",
    () => {

        if (
            current >= 0 &&
            current < filteredSongs.length - 1
        ) {

            playSong(current + 1);

            player.play().catch(
                () => {}
            );
        }
    }
);


/* =========================================================
   AUDIO GREŠKA
   ========================================================= */

player.addEventListener(
    "error",
    () => {

        if (
            current >= 0 &&
            filteredSongs[current]
        ) {

            nowPlaying.innerHTML =
                '<span class="error">' +
                "❌ Ne mogu učitati: " +
                filteredSongs[current].title +
                "</span>";
        }
    }
);


/* =========================================================
   PRETRAGA
   ========================================================= */

search.addEventListener(
    "input",
    () => {

        const text =
            search.value
                .trim()
                .toLocaleLowerCase();

        filteredSongs =
            songs.filter(song =>
                song.title
                    .toLocaleLowerCase()
                    .includes(text)
            );

        current = -1;

        renderPlaylist();

        if (filteredSongs.length > 0) {

            nowPlaying.textContent =
                "🎵 Izaberi pjesmu";
        }
    }
);


/* =========================================================
   TIPKE
   ========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.target.tagName === "INPUT"
        ) {
            return;
        }

        if (
            event.key === "ArrowRight" &&
            current < filteredSongs.length - 1
        ) {

            playSong(current + 1);
        }

        if (
            event.key === "ArrowLeft" &&
            current > 0
        ) {

            playSong(current - 1);
        }

        if (
            event.code === "Space"
        ) {

            event.preventDefault();

            if (player.paused) {

                if (current === -1) {
                    playSong(0);
                }

                player.play().catch(
                    () => {}
                );

            } else {

                player.pause();
            }
        }
    }
);


/* =========================================================
   START
   ========================================================= */

async function start() {

    try {

        await loadSongs();

        if (songs.length === 0) {

            nowPlaying.textContent =
                "🎵 Nema MP3 fajlova";

            status.innerHTML =
                '<span class="error">' +
                "Nijedan MP3 nije pronađen." +
                "</span>";

            return;
        }

        renderPlaylist();

        nowPlaying.textContent =
            "🎵 " +
            songs.length +
            " pjesama spremno";

    } catch (error) {

        console.error(error);

        nowPlaying.innerHTML =
            '<span class="error">' +
            "❌ Greška pri učitavanju muzike" +
            "</span>";

        status.innerHTML =
            '<span class="error">' +
            error.message +
            "</span>";
    }
}

start();

</script>

</body>
</html>
